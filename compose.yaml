services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: arzdesk
      POSTGRES_PASSWORD: arzdesk
      POSTGRES_DB: arzdesk
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arzdesk -d arzdesk"]
      interval: 5s
      timeout: 5s
      retries: 10
  migrate:
    build:
      context: .
      target: tooling
    command: ["npm", "run", "db:migrate"]
    environment:
      DATABASE_URL: postgresql://arzdesk:arzdesk@db:5432/arzdesk
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: .
      target: runner
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: postgresql://arzdesk:arzdesk@db:5432/arzdesk
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: http://localhost:3000
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  postgres-data:
