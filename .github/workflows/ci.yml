name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  format-review:
    if: github.event_name == 'pull_request' && github.head_ref == 'design/offline-home-polish'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generate formatted design files for review
        run: |
          npx prettier --write src/features/offline/offline-app.tsx src/app/offline/offline.css tests/e2e/offline-home.spec.ts
          echo 'ARZDESK_FORMAT_JSX_BEGIN'
          base64 -w0 src/features/offline/offline-app.tsx
          echo
          echo 'ARZDESK_FORMAT_JSX_END'
          echo 'ARZDESK_FORMAT_CSS_BEGIN'
          base64 -w0 src/app/offline/offline.css
          echo
          echo 'ARZDESK_FORMAT_CSS_END'
          echo 'ARZDESK_FORMAT_TEST_BEGIN'
          base64 -w0 tests/e2e/offline-home.spec.ts
          echo
          echo 'ARZDESK_FORMAT_TEST_END'
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: arzdesk
          POSTGRES_PASSWORD: arzdesk
          POSTGRES_DB: arzdesk
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U arzdesk -d arzdesk"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://arzdesk:arzdesk@localhost:5432/arzdesk
      BETTER_AUTH_SECRET: ci-only-not-for-production-thirty-two-plus-characters
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
        env:
          TEST_DATABASE_URL: postgresql://arzdesk:arzdesk@localhost:5432/arzdesk
      - run: npm run db:migrate
      # Production builds must not require runtime-only authentication credentials.
      - run: env -u BETTER_AUTH_SECRET -u BETTER_AUTH_URL npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          ARZDESK_CAPTURE_OFFLINE: "1"
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
