name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  format-review:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/offline-home-desktop-cache-refresh'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generate exact formatting for review
        run: |
          npx prettier --write src/features/offline/offline-app.tsx src/app/offline/offline.css public/sw.js next.config.ts tests/e2e/offline-populated.spec.ts
          for spec in JSX CSS SW CONFIG TEST; do
            case "$spec" in
              JSX) file=src/features/offline/offline-app.tsx ;;
              CSS) file=src/app/offline/offline.css ;;
              SW) file=public/sw.js ;;
              CONFIG) file=next.config.ts ;;
              TEST) file=tests/e2e/offline-populated.spec.ts ;;
            esac
            echo "ARZDESK_READY_${spec}_BEGIN"
            base64 -w0 "$file"
            echo
            echo "ARZDESK_READY_${spec}_END"
          done
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: arzdesk
          POSTGRES_PASSWORD: arzdesk
          POSTGRES_DB: arzdesk
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U arzdesk -d arzdesk"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://arzdesk:arzdesk@localhost:5432/arzdesk
      BETTER_AUTH_SECRET: ci-only-not-for-production-thirty-two-plus-characters
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
        env:
          TEST_DATABASE_URL: postgresql://arzdesk:arzdesk@localhost:5432/arzdesk
      - run: npm run db:migrate
      # Production builds must not require runtime-only authentication credentials.
      - run: env -u BETTER_AUTH_SECRET -u BETTER_AUTH_URL npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          ARZDESK_CAPTURE_HOME: "1"
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
