name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  format-suggestion:
    if: github.event_name == 'pull_request' && github.head_ref == 'release/public-launch-prep'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generate formatting suggestion for this PR
        run: |
          npx prettier --write src/app/about/page.tsx tests/e2e/about.spec.ts
          echo 'ARZDESK_ABOUT_BEGIN'
          base64 -w0 src/app/about/page.tsx
          echo
          echo 'ARZDESK_ABOUT_END'
          echo 'ARZDESK_TEST_BEGIN'
          base64 -w0 tests/e2e/about.spec.ts
          echo
          echo 'ARZDESK_TEST_END'
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: arzdesk
          POSTGRES_PASSWORD: arzdesk
          POSTGRES_DB: arzdesk
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U arzdesk -d arzdesk"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://arzdesk:arzdesk@localhost:5432/arzdesk
      BETTER_AUTH_SECRET: ci-only-not-for-production-thirty-two-plus-characters
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
        env:
          TEST_DATABASE_URL: postgresql://arzdesk:arzdesk@localhost:5432/arzdesk
      - run: npm run db:migrate
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
