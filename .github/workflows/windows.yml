name: Windows installer
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "desktop/**"
      - "scripts/prepare-desktop.mjs"
      - "src/features/offline/**"
      - "src/components/app-registration.tsx"
      - "src/app/download/**"
      - ".github/workflows/windows.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install web dependencies
        run: npm ci
      - name: Build Next.js website for bundling
        run: npm run build
      - name: Create standalone offline bundle
        run: node scripts/prepare-desktop.mjs
      - name: Install pinned Electron dependencies
        run: npm install --prefix desktop --no-audit --no-fund
      - name: Launch bundled offline app and verify hydration
        shell: pwsh
        run: |
          & ".\\desktop\\node_modules\\.bin\\electron.cmd" ".\\desktop\\main.cjs" --smoke-test
          if ($LASTEXITCODE -ne 0) { throw "Desktop smoke test failed: $LASTEXITCODE" }
      - name: Build NSIS Windows installer
        run: npm run dist:win --prefix desktop
      - name: Verify executable and SHA-256
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Path "dist-windows" -Filter "ArzDesk-Setup-*.exe")
          if ($files.Count -ne 1) { throw "Expected exactly one NSIS installer" }
          foreach ($file in $files) {
            if ($file.Length -lt 10000000) { throw "Installer unexpectedly small" }
            Get-FileHash -Algorithm SHA256 $file.FullName | Format-List
          }
      - name: Save verified Windows installer
        uses: actions/upload-artifact@v6
        with:
          name: ArzDesk-Windows-Installer
          path: dist-windows/ArzDesk-Setup-*.exe
          if-no-files-found: error
          retention-days: 30
