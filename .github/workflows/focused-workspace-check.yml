name: Focused workspace deletion browser check
on:
  push:
    branches: [feat/workspace-delete-invite-notifications]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: arzdesk
          POSTGRES_PASSWORD: arzdesk
          POSTGRES_DB: arzdesk
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U arzdesk -d arzdesk"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://arzdesk:arzdesk@localhost:5432/arzdesk
      BETTER_AUTH_SECRET: ci-only-not-for-production-thirty-two-plus-characters
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run build
      - run: npx playwright install chromium
      - run: npx playwright test tests/e2e/workspace-delete.spec.ts --retries=0
